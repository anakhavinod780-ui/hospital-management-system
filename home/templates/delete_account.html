{% extends 'base.html' %}

{% block content %}

<div style="
    max-width:500px;
    margin:60px auto;
    padding:30px;
    background:white;
    border-radius:12px;
    text-align:center;
">

    <h2>Delete Account?</h2>

    <p>
        Are you sure you want to permanently delete your patient account?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit"
                style="
                    background:#c03939;
                    color:white;
                    border:none;
                    padding:12px 20px;
                    border-radius:6px;
                    cursor:pointer;
                ">
            Yes, Delete My Account
        </button>

        <a href="{% url 'my_profile' %}"
           style="margin-left:15px;">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
