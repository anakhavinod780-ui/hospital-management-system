{% extends 'base.html' %}

{% block title %}Login | MediCare Hospital{% endblock %}

{% block content %}

<style>

    body {
    background:
        linear-gradient(
            rgba(10, 35, 55, 0.65),
            rgba(10, 35, 55, 0.65)
        ),
        url("https://images.openai.com/static-rsc-4/1-KN0_mLMu0coLQ0JXdUbk2kx5yzDAT_azd7XjVSAh4EjRf9Ho5Ocx2Y2JBfoHGtJhkNGurtWCLEARTaPQsbQBkTQFiCTUiEp2a9Ibb2DIUM0jzHPpA4KEsBQQl6srMopHNLXPmqqycUxUowdQcFlgu0STKLesqwVF9I5G21dwV1_sAz2GrL6--uEnVxxcBK?purpose=fullsize")
        center / cover no-repeat fixed;
    min-height: 100vh;
}

.login-container {
    max-width: 420px;
    margin: 50px auto;
    padding: 35px;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    position: relative;
    z-index: 1;
}
 
    .login-container h2 {
        text-align: center;
        color: #0f3d5e;
        font-size: 28px;
        margin-bottom: 10px;
    }

    .login-container .subtitle {
        text-align: center;
        color: #718096;
        font-size: 14px;
        margin-bottom: 28px;
    }

    .login-container form p {
        margin-bottom: 18px;
    }

    .login-container form label {
        display: block;
        margin-bottom: 7px;
        color: #263746;
        font-weight: 600;
        font-size: 14px;
    }

    .login-container input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #ccd8e2;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    .login-container input:focus {
        border-color: #1677a8;
        box-shadow: 0 0 0 3px rgba(22, 119, 168, 0.12);
    }

    .form-options {
        text-align: right;
        margin: 12px 0 22px;
    }

    .login-container a {
        color: #1677a8;
        text-decoration: none;
        font-size: 14px;
    }

    .login-container a:hover {
        text-decoration: underline;
    }

    .login-container button {
        width: 100%;
        padding: 13px;
        background: #0f3d5e;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s, transform 0.2s;
    }

    .login-container button:hover {
        background: #17618b;
        transform: translateY(-1px);
    }

    .login-container .footer-text {
        text-align: center;
        margin-top: 24px;
        margin-bottom: 0;
        color: #64748b;
        font-size: 14px;
    }

    @media (max-width: 480px) {
        .login-container {
            margin: 25px 12px;
            padding: 25px 20px;
        }

        .login-container h2 {
            font-size: 24px;
        }
    }
</style>

<div class="login-container">
    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your details to sign in</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-options">
            <a href="#">Forgot password?</a>
        </div>

        <button type="submit">Login</button>
    </form>

    <p class="footer-text">
        New here? <a href="{% url 'signup' %}">Sign up for free</a>
    </p>
</div>

{% endblock %}
